name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '18 16 1/7 * *'
  workflow_dispatch:

jobs:
  lint-markdown:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: yarn
        cache-dependency-path: lint/yarn.lock

    - name: Install awesome-lint
      working-directory: lint
      run: yarn install --frozen-lockfile

    # The rules to check are listed in lint/lint.js
    - name: Run awesome-lint
      working-directory: lint
      run: yarn lint

  check-deadlinks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install brok (and dependencies)
      run: |
        wget https://github.com/smallhadroncollider/brok/releases/download/1.1.0/brok-1.1.0_x86-64-linux.deb
        sudo dpkg -i brok-1.1.0_x86-64-linux.deb

    - name: Check for dead links
      # tcrf.net uses DDoS protection that breaks link checkers
      # <https://blog.xkeeper.net/uncategorized/tcrf-has-been-getting-ddosed/>
      run: brok --only-failures --ignore "https://tcrf.net" *.md
